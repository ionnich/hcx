name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck lua5.1 jq && sudo ln -sf "$(command -v luac5.1)" /usr/local/bin/luac
      - uses: oven-sh/setup-bun@v2
      # Rex isn't available on Linux; scripts/check skips `rex config check` when there's no server.
      - run: scripts/check
